name: tests

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - tests/**
      - .github/workflows/tests.yml
      - entrypoint.sh
      - Dockerfile
      - .dockerignore
      - package-lock.json
      - package.json
  push:
    branches:
      - main
    paths:
      - tests/**
      - .github/workflows/tests.yml
      - entrypoint.sh
      - Dockerfile
      - .dockerignore
      - package-lock.json
      - package.json

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shortcut: zizmor wants "uses: $/" in these steps, but actionlint 1.7.12
      # rejects it. Drop the zizmor ignores once actionlint supports "$/".
      - name: Test 1 - Check done in tests/test2 - tests/test2/normal.md
        # Unpinned Actions Full Length Commit SHA
        uses: ./ # zizmor: ignore[self-repository]
        with:
          debug: true
          search_paths: tests/test2

      - name: Test 2 - Check with "exclude", "search_paths" and "quiet" - tests/test2/normal.md
        uses: ./ # zizmor: ignore[self-repository]
        with:
          exclude: |
            CHANGELOG.md
            test1/excluded_file.md
            bad.md
            tests/test3-multiple-files/
          search_paths: tests/
          quiet: true

      - name: Test 3 - Check "all" files
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          debug: true
          search_paths: tests

      - name: Create config file for markdown-link-check in "Test 4"
        run: |
          cat > .mlc_config.json << EOF
          {
            "ignorePatterns": [
              {
                "pattern": "^https://non-existing-domain.com"
              }
            ]
          }
          EOF

      - name: Test 4 - Check with "search_paths", "verbose" and ".mlc_config.json" - "https://non-existing-domain.com" is ignored
        uses: ./ # zizmor: ignore[self-repository]
        with:
          search_paths: |
            tests/test1
            tests/test2
          verbose: true

      - name: Test 5 - Excluding all files - must fail with "No Markdown files found"
        id: test5
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          exclude: "*.md"
          search_paths: tests

      - name: Test 5 must fail
        if: steps.test5.outcome != 'failure'
        run: exit 1
